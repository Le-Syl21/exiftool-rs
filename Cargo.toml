[package]
name = "exiftool-rs"
version = "1.0.0"
edition = "2021"
description = "Read, write, and edit metadata in every format ExifTool handles — a faithful Rust port of Perl ExifTool 13.60, its own Perl engine running ExifTool's code, with a CLI, a GUI and a Rust API"
# As the port declares: ExifTool itself is free software under the same terms
# as Perl (GPL or Artistic), and this port, a derived work, takes the GPL.
license = "GPL-3.0-or-later"
repository = "https://github.com/Le-Syl21/exiftool-rs"
homepage = "https://github.com/Le-Syl21/exiftool-rs"
documentation = "https://docs.rs/exiftool-rs"
readme = "README.md"
keywords = ["exif", "metadata", "jpeg", "tiff", "xmp"]
categories = ["multimedia::images", "parser-implementations"]
# Only what a build needs: the library, the binaries and the examples, the
# embedded dumps (data/, 12 MB raw: the .crate is about 6 MB, under the
# 10 MB crates.io takes) and the GUI's icon. The tests, the judges' scripts
# and their fixtures need an ExifTool checkout and stay in the repository.
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/build.rs",
    "/src/**/*",
    "/data/*.pld",
    "/data/*.rs",
    "/data/*.tsv",
    "/examples/*.rs",
    "/assets/icon.png",
    "/assets/icon.ico",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[lib]
name = "exiftool_rs"
path = "src/lib.rs"

[dependencies]
# FxHash: a fast hash for the interpreter's maps and the Perl hashes (whose
# order is kept apart, so it changes no output); pure Rust
rustc-hash = "2"
# Perl-compatible regular expressions on bytes (backreferences, lookahead,
# /s on binary data), as ExifTool's patterns and magic numbers need.
pcre2 = "0.2"
# PCRE2 itself (the C library pcre2 builds in), for its version in -ver -v
pcre2-sys = "0.2"
# Digest::MD5
md-5 = "0.10"
# Digest::SHA
sha2 = "0.10"
sha1 = "0.10"
# Compress::Zlib and IO::(Un)Compress: zlib itself, as perl uses, so
# compressed output is byte for byte the same
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# zlib's deflateInit2 directly: Compress::Raw::Zlib deflates with memLevel 9,
# which flate2 cannot set, and the memory level changes the output bytes.
# "static": the crate's own copy of zlib, built in, not the system's (whose
# version, if any, would decide the bytes written). Measured on 197 inputs
# against Perl: C zlib 197/197 identical, zlib-rs (pure Rust) 8/197, so the
# compressor stays C.
libz-sys = { version = "1", features = ["static"] }
# IO::(Un)Compress::Brotli: mbrotli, Brotli in Rust whose encoder is
# byte-identical to Google's library (the perl module's). Measured on 197
# inputs against Perl: mbrotli 197/197 identical (as Google's C library,
# brotlic), the brotli crate 186/197.
mbrotli = "0.5.17"
# IO::Uncompress::Bunzip2 (Rawzor), on the bzip2 reference code
bzip2 = "0.6"
# Unicode::GCString's columns (the script's plain output with -lang ja,
# zh, ko...): East Asian widths, pure Rust
unicode-width = "0.2"

# The GUI's dependencies (feature "gui"), as on main: eframe with glow
# (OpenGL) in place of its default wgpu, whose D3D12 backend does not build
# on Windows; image for the icon, rfd for the file dialogs, and the Noto
# fonts of the CJK, Arabic, Devanagari and Bengali scripts.
eframe = { version = "0.37", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "web_screen_reader",
    "x11",
] }
# (egui 0.37 moved its emoji and symbol fonts behind a feature: without it
# the marks and icons of the window, ✏ 🌐 ☀ 🌙, are drawn as empty boxes)
egui = { version = "0.37", optional = true, features = ["monochrome_emoji_fonts"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff"] }
rfd = { version = "0.17", optional = true }
noto-fonts-dl = { version = "0.1.10", optional = true, features = ["ar", "bn", "hi", "ja", "ko", "zh", "zh_tw"] }

# The binaries' global allocator (exiftool-rs, exiftool-rs-gui and the
# run_t judge): rusty_alloc, a pure-Rust remake of mimalloc. The
# interpreter allocates many small values; measured over the test images
# and 120 RAW files (CPU time, pinned, best of 8): system malloc 0 %,
# mimalloc (C) -11 / -12 %, rusty_alloc -10 / -13 %, dlmalloc +18 / +14 %,
# with the same output for all. The library never sets it: a program using
# the crate keeps its own allocator, and can leave this one out of its
# build with default-features = false (feature rusty-alloc).
rusty_alloc-api = { version = "2.2.7", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Win32::API, Win32API::File, Win32::FindFile and Term::ReadKey's console
# modes on Windows (src/modules/win32.rs, term_readkey.rs): the Win32 API's
# bindings, pure Rust
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(windows)'.build-dependencies]
winres = { version = "0.1", optional = true }

# What clippy's gate is (CI's lint job): its correctness and suspicious
# lints are errors. Its style and complexity lints are only warnings: the
# port follows the Perl line by line (late initialisation as `my $x;`, index
# loops, nested ifs as ExifTool writes them), which they would rewrite.
# Two correctness lints flag what the port does on purpose: a loop that
# runs once and is left by `break` is Perl's bare block left by `last`, and
# the digits of pi or e are the literals ExifTool writes (Perl's
# `3.14159265358979`), whose value is part of the output.
[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
never_loop = "allow"
approx_constant = "allow"

[features]
# The built-in format extensions: writers for the types ExifTool reads and
# does not write (ID3, Vorbis comments, Matroska; src/api/extra_writers/),
# and rusty_alloc as the binaries' allocator
default = ["extra-writers", "rusty-alloc"]
extra-writers = []
rusty-alloc = ["dep:rusty_alloc-api"]
# The GUI, exiftool-rs-gui (none of its dependencies in the default build)
gui = ["eframe", "egui", "image", "rfd", "noto-fonts-dl"]
# The Windows icon/version resource in the executables (build.rs)
win-icon = ["winres"]
# Lets the `egui-mcp` server attach to a running GUI, to drive and screenshot
# it (`EGUI_INSPECTION=1`, served on 127.0.0.1:5719). Development only.
inspection = ["gui", "eframe/inspection"]
# The live parity auditor (src/bin/parity), which the release's parity
# report is made with. No dependency: it shells out to curl, tar and perl.
parity = []

# The application, named exiftool-rs so that it can never be mistaken for
# Perl's exiftool.
[[bin]]
name = "exiftool-rs"
path = "src/main.rs"

# The GUI, built by `cargo build --features gui`. Its tests (the model, with
# no window) run with `cargo test --features gui`.
[[bin]]
name = "exiftool-rs-gui"
path = "src/bin/exiftool_rs_gui/main.rs"
required-features = ["gui"]

# Live differential parity auditor against a pinned Perl ExifTool release.
# Dev-only (needs perl and the network).
[[bin]]
name = "parity"
path = "src/bin/parity/main.rs"
required-features = ["parity"]
