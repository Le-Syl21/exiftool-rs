[package]
name = "exiftool-port"
version = "0.0.0"
edition = "2021"
description = "Faithful Rust port of Perl ExifTool 13.59 (work in progress)"
license = "GPL-3.0-or-later"
publish = false

# Standalone while the port grows next to the current crate.
[workspace]

[lib]
name = "exiftool_port"
path = "src/lib.rs"

[dependencies]
# Perl-compatible regular expressions on bytes (backreferences, lookahead,
# /s on binary data), as ExifTool's patterns and magic numbers need.
pcre2 = "0.2"
# Digest::MD5
md-5 = "0.10"
# Digest::SHA
sha2 = "0.10"
sha1 = "0.10"
# Compress::Zlib and IO::(Un)Compress: zlib itself, as perl uses, so
# compressed output is byte for byte the same
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# zlib's deflateInit2 directly: Compress::Raw::Zlib deflates with memLevel 9,
# which flate2 cannot set, and the memory level changes the output bytes.
# "static": the crate's own copy of zlib, built in, not the system's (whose
# version, if any, would decide the bytes written). Measured on 197 inputs
# against Perl: C zlib 197/197 identical, zlib-rs (pure Rust) 8/197, so the
# compressor stays C.
libz-sys = { version = "1", features = ["static"] }
# IO::(Un)Compress::Brotli: mbrotli, Brotli in Rust whose encoder is
# byte-identical to Google's library (the perl module's). Measured on 197
# inputs against Perl: mbrotli 197/197 identical (as Google's C library,
# brotlic), the brotli crate 186/197.
mbrotli = "0.5.17"
# IO::Uncompress::Bunzip2 (Rawzor), on the bzip2 reference code
bzip2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The application, named as the crate's binary on main (exiftool-rs), so
# that it can never be mistaken for Perl's exiftool.
[[example]]
name = "exiftool-rs"
path = "examples/exiftool_rs.rs"
