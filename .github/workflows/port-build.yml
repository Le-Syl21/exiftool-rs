# Build check of the Perl port (port/) on every release platform, run by hand.
#
# The port will replace the root crate at 1.0; until then ci.yml only builds
# the root crate. This job proves the port (and its C dependencies, PCRE2 and
# a static zlib) builds and runs on each target: CLI, GUI, the library's unit
# tests and a read of the test images. Nothing is packaged or uploaded.
# The Windows job also exercises the Win32 modules (Unicode names,
# wildcards, FileCreateDate, -P). Locally, `CC_x86_64_pc_windows_gnu=gcc cargo check --target
# x86_64-pc-windows-gnu` type-checks the Windows build without mingw.
name: Port build

on:
  workflow_dispatch:
  # A workflow can only be dispatched from the default branch, which does not
  # have this file yet: on perl-port it runs when the file itself or the
  # platform-specific modules change (Windows can't be run locally).
  push:
    branches: [perl-port]
    paths:
      - '.github/workflows/port-build.yml'
      - 'port/src/modules/win32.rs'
      - 'port/src/modules/posix_strptime.rs'
      - 'port/src/modules/term_readkey.rs'
      - 'port/src/modules/file_statx.rs'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    defaults:
      run:
        shell: bash
        working-directory: port

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: port

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libglib2.0-dev

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} --example exiftool-rs

      - name: Build GUI (with icon on Windows)
        run: cargo build --release --target ${{ matrix.target }} --bin exiftool-rs-gui --features gui${{ runner.os == 'Windows' && ',win-icon' || '' }}

      - name: Library unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --lib

      - name: Read the test images
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin=target/${{ matrix.target }}/release/examples/exiftool-rs
          "$bin" -ver
          "$bin" -a -u -G1 ../tests/images > read.txt
          echo "$(grep -c '^========' read.txt) files, $(wc -l < read.txt) lines"
          "$bin" -lang fr -s ../tests/images | head -20

      # The Win32 modules (src/modules/win32.rs): Unicode file names through
      # Win32API::File (Open, Exists, Rename), Win32::FindFile (wildcards,
      # directories) and Win32::API (WindowsLongPath, FileCreateDate, -P)
      - name: Windows file names, times and attributes
        if: runner.os == 'Windows'
        run: |
          set -ex
          bin=$PWD/target/${{ matrix.target }}/release/examples/exiftool-rs
          "$bin" -ver -v | tee ver.txt
          grep -q '^  Win32::API ' ver.txt
          grep -q '^  Win32::FindFile ' ver.txt
          grep -q '^  Win32API::File ' ver.txt
          mkdir -p 'wïn/sübdir'
          cp ../tests/images/Canon.jpg 'wïn/Ünïcödé 日本.jpg'
          cp ../tests/images/Canon.jpg 'wïn/sübdir/plain.jpg'
          # a wildcard (quoted: the port's FindFile expands it, not bash)
          "$bin" -charset filename=utf8 -s -FileName -Model 'wïn/*.jpg' | tee out.txt
          grep -q 'FileName *: Ünïcödé 日本.jpg' out.txt
          # a directory, recursively
          "$bin" -charset filename=utf8 -r -s3 -FileName wïn | sort | tee out.txt
          test "$(cat out.txt)" = "$(printf 'plain.jpg\nÜnïcödé 日本.jpg')"
          # writing keeps the file times with -P (SetFileTime)
          f='wïn/Ünïcödé 日本.jpg'
          before=$("$bin" -charset filename=utf8 -s3 -FileModifyDate "$f")
          "$bin" -charset filename=utf8 -P -overwrite_original -Artist=Win32 "$f"
          test "$("$bin" -charset filename=utf8 -s3 -FileModifyDate "$f")" = "$before"
          test "$("$bin" -charset filename=utf8 -s3 -Artist "$f")" = Win32
          # FileCreateDate, written and read back (SetFileTime, GetFileTime)
          "$bin" -charset filename=utf8 '-FileCreateDate=2020:01:02 03:04:05' "$f"
          "$bin" -charset filename=utf8 -s3 -FileCreateDate "$f" | grep -q '^2020:01:02 03:04:05'
          # a write that keeps a backup (Rename), then deleted (Unlink)
          "$bin" -charset filename=utf8 -Comment=Win32 "$f"
          test -f "${f}_original"
          "$bin" -charset filename=utf8 -delete_original! wïn
          test ! -f "${f}_original"
          # the Windows file attributes (GetFileAttributesW)
          attrib +r "$(cygpath -w "$f")"
          "$bin" -charset filename=utf8 -s3 -FileAttributes "$f" | tee out.txt
          grep -q 'Read Only' out.txt
          # a directory with a Unicode name made for a new file (CreateDirectoryW)
          "$bin" -charset filename=utf8 -o 'wïn/nëw/' "$f"
          test -f 'wïn/nëw/Ünïcödé 日本.jpg'
