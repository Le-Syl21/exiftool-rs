name: Upstream drift

# Detects what upstream ExifTool has gained and this port has not. Why: Garmin
# FIT support landed in 13.56 (April 2026) and went unnoticed for six releases,
# then turned up by accident. Nothing flagged it.
#
# Two signals, deliberately kept apart:
#
#  1. Test corpus — a file that appeared in upstream t/images/. STRONG signal:
#     when ExifTool gains a format, it adds that format's test file. It is also
#     the only one that would have caught Garmin FIT, because the extension
#     signal is blind there: this port already maps .fit to FITS (an unrelated
#     astronomy format), so the extension was present on both sides.
#
#  2. Extensions — a diff of `exiftool -listf` against `exiftool-rs -listf`.
#     WEAK and noisy signal: it also lists everything we will never port.
#     Useful only for spotting a format that came without a test file.
on:
  schedule:
    - cron: '0 6 1 * *'      # the 1st of every month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Check out upstream ExifTool
        run: git clone -q --depth 1 https://github.com/exiftool/exiftool.git /tmp/exiftool

      - name: Compare
        id: diff
        run: |
          set -euo pipefail
          export LC_ALL=C

          upstream_ver=$(cd /tmp/exiftool && perl exiftool -ver)
          ported_ver=$(grep -oE 'ExifTool v?[0-9]+\.[0-9]+' README.md | head -1 | grep -oE '[0-9]+\.[0-9]+')

          ls /tmp/exiftool/t/images/ | sort > /tmp/up-corpus.txt
          ls tests/images/           | sort > /tmp/my-corpus.txt
          comm -23 /tmp/up-corpus.txt /tmp/my-corpus.txt > /tmp/new-files.txt || true

          cargo build --release --quiet --bin exiftool-rs
          (cd /tmp/exiftool && perl exiftool -listf) | tail -n +2 | tr ' ' '\n' | grep . | sort -u > /tmp/up-ext.txt
          ./target/release/exiftool-rs -listf        | tail -n +2 | tr ' ' '\n' | grep . | sort -u > /tmp/my-ext.txt
          comm -23 /tmp/up-ext.txt /tmp/my-ext.txt > /tmp/new-ext.txt || true

          {
            echo "## Upstream ExifTool: \`$upstream_ver\` — ported here: \`$ported_ver\`"
            echo
            if [ -s /tmp/new-files.txt ]; then
              echo "### 🔴 Test files present upstream, missing here"
              echo
              echo "When ExifTool gains a format, it adds that format's test file."
              echo "Each line here is most likely new coverage to port."
              echo
              echo '```'
              cat /tmp/new-files.txt
              echo '```'
            else
              echo "### ✅ Test corpus is in step with upstream"
            fi
            echo
            echo "<details><summary>Extensions declared upstream and not here ($(wc -l < /tmp/new-ext.txt))</summary>"
            echo
            echo "Secondary, noisy signal: it also contains the formats we will not port."
            echo
            echo '```'
            tr '\n' ' ' < /tmp/new-ext.txt | fold -sw 76
            echo '```'
            echo "</details>"
          } > /tmp/report.md

          if [ -s /tmp/new-files.txt ]; then echo "drift=yes" >> "$GITHUB_OUTPUT"; else echo "drift=no" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the issue
        if: steps.diff.outputs.drift == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Upstream drift: new ExifTool test files are not covered here"
          existing=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/report.md
          else
            gh issue create --title "$title" --body-file /tmp/report.md
          fi

      - name: Summary
        run: cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
