name: parity

# On-demand differential parity check against a chosen Perl ExifTool version —
# the manual companion to the release gate in ci.yml (which pins
# EXIFTOOL_VERSION). Use it to measure drift against a newer ExifTool before
# deciding to port it. No schedule: it runs only when you trigger it.
on:
  workflow_dispatch:
    inputs:
      exiftool_version:
        description: "ExifTool version to diff against (blank = the pinned EXIFTOOL_VERSION)"
        required: false
        default: ""

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      # ExifTool needs optional Perl modules to decode the corpus fully; without
      # them it emits fewer tags and the diff shows fake deltas. Derive the set
      # from the Debian/Ubuntu exiftool package's own Recommends+Suggests (we
      # read only its metadata, not the distro's ExifTool). The binary also
      # checks their presence and fails clearly if one is missing.
      - name: ExifTool's recommended Perl modules
        run: |
          sudo apt-get update
          mods=$(apt-cache show libimage-exiftool-perl \
            | awk -F': ' '/^Recommends:|^Suggests:/ {print $2}' \
            | tr ',' '\n' | sed 's/[[:space:]]//g' | sort -u)
          echo "modules: $mods"
          test -n "$mods"
          sudo apt-get install -y $mods

      - name: Live parity
        run: |
          v='${{ inputs.exiftool_version }}'
          if [ -n "$v" ]; then
            cargo run --release --features parity --bin parity -- --exiftool "$v"
          else
            cargo run --release --features parity --bin parity
          fi
