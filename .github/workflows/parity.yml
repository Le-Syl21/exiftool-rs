name: parity

# Differential parity check against a Perl ExifTool version — the companion to
# the release gate in ci.yml (which pins EXIFTOOL_VERSION). Triggered manually
# to measure drift against a *newer* ExifTool before deciding to port it, and
# weekly against the pinned one.
#
# Parity is a DATA gate, not a build one: a routine `cargo update` took `xml`
# 1.3 -> 1.4 and cost three tags of read parity while compiling clean with every
# test green (see the `escape_attribute_whitespace` fix). Nothing on the path of
# a lockfile commit would have caught it — ci.yml's parity job only runs on
# tags, i.e. after the regression is already in a release candidate.
#
# It used to run on every push to `main`, which is a full build several times a
# day. The gate now sits in three cheaper places: `target/release/parity` run
# locally before each push, this weekly run, and the tag gate in ci.yml. The
# weekly one is what still catches a regression nobody ran locally.
on:
  schedule:
    - cron: '0 5 * * 1'      # Monday morning
  workflow_dispatch:
    inputs:
      exiftool_version:
        description: "ExifTool version to diff against (blank = the pinned EXIFTOOL_VERSION)"
        required: false
        default: ""

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      # The distro exiftool package pulls its optional Perl modules via Recommends
      # (Archive::Zip, LZMA, Brotli, Unicode::LineBreak) + Suggests (POSIX::strptime);
      # Perl packages depend only on Perl, so --install-suggests stays small. Its
      # exiftool binary is unused — the parity binary uses the downloaded pinned
      # version. check_modules() still asserts the required set is present.
      - name: ExifTool's optional Perl modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --install-recommends --install-suggests \
            libimage-exiftool-perl

      - name: Show which Perl module packages got installed
        run: dpkg -l | awk '$2 ~ /perl/ && $2 ~ /zip|compress|brotli|lzma|strptime|linebreak|charset|exiftool/ {print $2, $3}'

      - name: Live parity
        run: |
          v='${{ inputs.exiftool_version }}'
          if [ -n "$v" ]; then
            cargo run --release --features parity --bin parity -- --exiftool "$v"
          else
            cargo run --release --features parity --bin parity
          fi
