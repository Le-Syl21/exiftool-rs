name: CI

# Aucun build sur push `main` : le travail arrive en direct sur main, donc un
# build par commit ne ferait que du bruit. Les gates tournent sur PR, sur tag
# (avant toute signature/publication) et à la demande.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Garde-fou posé au tout début du pipeline : le tag doit correspondre à la
      # version du crate. Sans lui, un tag v0.6.2 a déjà publié une release
      # GitHub alors que Cargo.toml était resté en 0.6.1 — crates.io n'a jamais
      # reçu la version, et comme le publish tolère « already exists », le run
      # est resté vert et personne n'a rien vu.
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"                  # v1.2.3-rc1 → 1.2.3
          # `cargo pkgid` lit la version que le crate publié utilise vraiment,
          # sans supposer où se trouve le champ dans Cargo.toml.
          crate=$(cargo pkgid -p exiftool-rs)
          crate="${crate##*[@#]}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME mais Cargo.toml en $crate — mets Cargo.toml à jour puis retague"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME ↔ Cargo.toml $crate : OK"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libglib2.0-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (CLI)
        run: cargo clippy --release -- -D warnings

      - name: Clippy (GUI)
        run: cargo clippy --release --features gui -- -D warnings

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          # Sans cette ligne, `--target` échouerait sur la compilation croisée
          # macOS x86_64 (le runner macos-latest est arm64).
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libglib2.0-dev

      - name: Build CLI (with icon on Windows)
        run: cargo build --release --target ${{ matrix.target }} ${{ runner.os == 'Windows' && '--features win-icon' || '' }}

      - name: Build GUI (with icon on Windows)
        run: cargo build --release --target ${{ matrix.target }} --features gui${{ runner.os == 'Windows' && ',win-icon' || '' }}

      - name: Run tests
        if: matrix.target != 'x86_64-apple-darwin'
        # Release matches how the crate is built/run and how the parity baseline is
        # generated (debug panics on arithmetic overflow, skewing the parity corpus).
        run: cargo test --release

      # --- Empaquetage (binaires non signés ; la signature Apple est faite plus
      # bas, dans un job dédié derrière l'environnement `signing`). ---

      # --- Package CLI ---
      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        run: tar czf exiftool-rs-cli-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release exiftool-rs

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/exiftool-rs.exe -DestinationPath exiftool-rs-cli-${{ matrix.label }}.zip

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-${{ matrix.label }}
          path: exiftool-rs-cli-${{ matrix.label }}.*

      # --- Package GUI ---
      - name: Package GUI (Unix)
        if: runner.os != 'Windows'
        run: tar czf exiftool-rs-gui-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release exiftool-rs-gui

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/release/exiftool-rs-gui.exe -DestinationPath exiftool-rs-gui-${{ matrix.label }}.zip

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-${{ matrix.label }}
          path: exiftool-rs-gui-${{ matrix.label }}.*

  # Gate de parité différentielle live, avant toute signature : on lance le Perl
  # ExifTool épinglé (EXIFTOOL_VERSION, PAS la dernière version — sinon un tag
  # amont en avance bloquerait la release) et exiftool-rs sur le corpus, et on
  # diffe la sortie. Un delta lecture nouveau ou un écart d'écriture fait échouer
  # le job, donc rien n'est signé ni publié. Le bin télécharge ExifTool lui-même ;
  # ubuntu-latest fournit perl/curl/tar, et on installe les modules Perl optionnels
  # dont le corpus a besoin (sinon ExifTool décode moins → faux deltas ; le bin
  # vérifie aussi leur présence et échoue proprement si l'un manque).
  parity:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Install ExifTool's optional Perl modules (match the baseline env)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libarchive-zip-perl \
            libio-compress-brotli-perl \
            libcompress-raw-lzma-perl \
            libposix-strptime-perl \
            libunicode-linebreak-perl \
            libmime-charset-perl

      - name: Live parity vs pinned Perl ExifTool
        run: cargo run --release --features parity --bin parity

  # Signature + notarisation Apple du CLI et de la GUI. Derrière `signing` au même
  # titre que Windows : les secrets Apple sont désormais des secrets d'environnement
  # (illisibles depuis le job `build`, qui ne déclare aucun environnement), et une
  # signature Developer ID engage l'identité du propriétaire — elle ne doit jamais
  # partir sans approbation explicite.
  sign-apple:
    needs: [build, parity]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: signing
    steps:
      - name: Download the macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: exiftool-rs-*-macos-*
          path: dl

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign & notarize the macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit and poll with timeout + retry (3 attempts, 5/15/45 min backoff)
          notarize_once() {
            local zip="$1" label="$2" timeout="$3"

            local output
            output=$(xcrun notarytool submit "$zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --verbose 2>&1)
            echo "$output"
            local sub_id
            sub_id=$(echo "$output" | awk '/id:/{print $2; exit}')
            [ -n "$sub_id" ] || { echo "$label: failed to get submission ID"; return 1; }
            echo "$label: submitted (id: $sub_id)"

            local deadline=$((SECONDS + timeout))
            while [ $SECONDS -lt $deadline ]; do
              sleep 30
              local info
              info=$(xcrun notarytool info "$sub_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1) || { echo "$label: network error, retrying poll..."; continue; }

              local status
              status=$(echo "$info" | awk '/status:/{print $2; exit}')
              echo "$label: $status"

              case "$status" in
                Accepted) return 0 ;;
                Invalid|Rejected)
                  xcrun notarytool log "$sub_id" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_ID_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" 2>&1 || true
                  return 1 ;;
              esac
            done
            echo "$label: timed out after $((timeout / 60)) minutes"
            return 2  # timeout, retryable
          }

          notarize() {
            local zip="$1" label="$2"
            local backoffs=(300 900 2700)  # 5 / 15 / 45 minutes
            for i in 0 1 2; do
              echo "$label: attempt $((i + 1))/3"
              notarize_once "$zip" "$label" "${backoffs[$i]}" && return 0
              local rc=$?
              [ $rc -eq 2 ] || return $rc  # only retry on timeout (rc=2)
              [ $i -lt 2 ] && echo "$label: retrying after timeout..."
            done
            return 1
          }

          SIGN_ID="Developer ID Application: Sylvain Gargasson ($APPLE_TEAM_ID)"

          # Les quatre artefacts macOS : CLI + GUI, pour chaque architecture. Le
          # nom du binaire dans l'archive dépend de la variante, pas du label.
          artifacts=(
            "exiftool-rs-cli-macos-arm64:exiftool-rs"
            "exiftool-rs-gui-macos-arm64:exiftool-rs-gui"
            "exiftool-rs-cli-macos-x86_64:exiftool-rs"
            "exiftool-rs-gui-macos-x86_64:exiftool-rs-gui"
          )

          # 1) Signature + vérification, puis zip destiné à la notarisation.
          for entry in "${artifacts[@]}"; do
            art="${entry%%:*}"
            bin="${entry##*:}"
            echo "::group::sign $art"
            work="$RUNNER_TEMP/$art"
            mkdir -p "$work"
            tar xzf "dl/$art/$art.tar.gz" -C "$work"

            codesign --force --options runtime \
              --sign "$SIGN_ID" \
              --timestamp "$work/$bin"
            codesign --verify --strict --verbose=2 "$work/$bin"

            ditto -c -k --keepParent "$work/$bin" "$RUNNER_TEMP/$art.zip"
            echo "::endgroup::"
          done

          # 2) Notarisation en parallèle (chaque soumission passe des minutes à
          # attendre Apple), puis on collecte les codes de retour un par un.
          pids=()
          for entry in "${artifacts[@]}"; do
            art="${entry%%:*}"
            notarize "$RUNNER_TEMP/$art.zip" "$art" &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::${artifacts[$i]%%:*} : notarisation échouée"; failed=1; }
          done
          [ $failed -eq 0 ] || exit 1

          # 3) Ré-empaquetage des binaires signés, sous leur nom d'origine.
          for entry in "${artifacts[@]}"; do
            art="${entry%%:*}"
            bin="${entry##*:}"
            tar czf "$art.tar.gz" -C "$RUNNER_TEMP/$art" "$bin"
          done

      - name: Re-upload the signed CLI arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-macos-arm64
          path: exiftool-rs-cli-macos-arm64.tar.gz
          overwrite: true

      - name: Re-upload the signed GUI arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-macos-arm64
          path: exiftool-rs-gui-macos-arm64.tar.gz
          overwrite: true

      - name: Re-upload the signed CLI x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-macos-x86_64
          path: exiftool-rs-cli-macos-x86_64.tar.gz
          overwrite: true

      - name: Re-upload the signed GUI x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-macos-x86_64
          path: exiftool-rs-gui-macos-x86_64.tar.gz
          overwrite: true

  # Authenticode-sign the Windows CLI + GUI with ssign — the Linux runner signs
  # them via Certum (no Windows, no vendor stack). Gated by the `signing`
  # environment (owner approval); the release below needs it.
  sign-windows:
    needs: [build, parity]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Install ssign (prebuilt binary from the latest release)
        run: |
          curl -fsSL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      - name: Download CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: exiftool-rs-cli-windows-x86_64
          path: dl

      - name: Download GUI artifact
        uses: actions/download-artifact@v8
        with:
          name: exiftool-rs-gui-windows-x86_64
          path: dl

      - name: Sign CLI + GUI with ssign (via Certum)
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          cd dl
          unzip -o exiftool-rs-cli-windows-x86_64.zip
          unzip -o exiftool-rs-gui-windows-x86_64.zip
          ssign --verbose \
            -n "exiftool-rs" -u "https://github.com/${{ github.repository }}" \
            exiftool-rs.exe exiftool-rs-gui.exe
          sudo apt-get update -qq && sudo apt-get install -y osslsigncode
          # Vérifie les faits, pas la présence d'une phrase. « Calculated message
          # digest » apparaît AUSSI quand le digest ne correspond pas, et ne dit
          # rien de l'horodatage : ce contrôle laissait donc passer une signature
          # que Windows aurait rejetée, et des binaires non horodatés — donc
          # invalides dès l'expiration du certificat.
          verify_signature() {
            local out
            out=$(osslsigncode verify "$1" 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q "MISMATCH"; then
              echo "::error::$1 : digest Authenticode invalide (Windows le verrait comme falsifié)"
              return 1
            fi
            if echo "$out" | grep -q "Timestamp is not available"; then
              echo "::error::$1 : signature non horodatée (invalide dès l'expiration du certificat)"
              return 1
            fi
            if ! echo "$out" | grep -q "Signature verification: ok"; then
              echo "::error::$1 : vérification de signature échouée"
              return 1
            fi
          }
          for f in exiftool-rs.exe exiftool-rs-gui.exe; do
            verify_signature "$f"
          done
          rm -f exiftool-rs-cli-windows-x86_64.zip exiftool-rs-gui-windows-x86_64.zip
          zip -j exiftool-rs-cli-windows-x86_64.zip exiftool-rs.exe
          zip -j exiftool-rs-gui-windows-x86_64.zip exiftool-rs-gui.exe

      - name: Re-upload signed CLI
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-windows-x86_64
          path: dl/exiftool-rs-cli-windows-x86_64.zip
          overwrite: true

      - name: Re-upload signed GUI
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-windows-x86_64
          path: dl/exiftool-rs-gui-windows-x86_64.zip
          overwrite: true

  release:
    needs: [build, sign-windows, sign-apple]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Download outside the repo working tree so `cargo publish` (after the
      # checkout below) sees a clean tree.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          # Tags pré-release (v*-rc/-beta) marqués « pre-release » dans l'UI GitHub.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ runner.temp }}/artifacts/**/*

  # Publication crates.io — seul geste irréversible du pipeline (« yank » ne
  # supprime rien) : elle passe donc APRÈS la release GitHub, qui est révocable,
  # et uniquement sur les tags finaux. Trusted Publishing : aucun secret longue
  # durée, GitHub atteste l'identité du workflow (repo + fichier + environnement)
  # et crates.io émet un jeton éphémère, révoqué en fin de job.
  publish-crates:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write        # nécessaire pour demander le jeton OIDC à GitHub

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - name: Get a temporary crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if cargo publish 2>&1 | tee /tmp/publish.log; then
            echo "published"
          elif grep -q "already exists" /tmp/publish.log; then
            echo "this version is already on crates.io — nothing to do"
          else
            exit 1
          fi
