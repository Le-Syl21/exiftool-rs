name: CI

# Nothing builds on a push to `main`: work lands directly on main, so a build
# per commit would only be noise. The gates run on pull requests, at a tag
# (before anything is signed or published) and on demand.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The Perl ExifTool release the port follows (src/api/mod.rs,
  # EXIFTOOL_VERSION; the lint job checks the two agree). Its source tree is
  # what the tests that need one and the judges of the parity job read.
  EXIFTOOL_VERSION: "13.60"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          components: clippy

      # First thing in the pipeline: the tag has to match the crate version.
      # Without it a v0.6.2 tag once published a GitHub release while Cargo.toml
      # still said 0.6.1 — crates.io never received the version, and since the
      # publish step tolerates "already exists", the run stayed green and
      # nobody saw a thing.
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%%-*}"                  # v1.2.3-rc1 → 1.2.3
          # `cargo pkgid` reports the version the published crate actually
          # uses, without assuming where the field sits in Cargo.toml.
          crate=$(cargo pkgid -p exiftool-rs)
          crate="${crate##*[@#]}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $crate — update Cargo.toml, then re-tag"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME <-> Cargo.toml $crate: OK"

      # The ExifTool the tests and the judges download is the one the port
      # follows, whose modules are embedded in data/.
      - name: Check that EXIFTOOL_VERSION is the port's
        run: |
          grep -q "^pub const EXIFTOOL_VERSION: &str = \"$EXIFTOOL_VERSION\";" src/api/mod.rs || {
            echo "::error::EXIFTOOL_VERSION=$EXIFTOOL_VERSION here, but src/api/mod.rs says $(grep 'EXIFTOOL_VERSION: &str' src/api/mod.rs)"
            exit 1
          }

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libglib2.0-dev

      # No `cargo fmt --check`: the port is written in its own layout (one
      # statement per line, however long, to follow the Perl line by line)
      # and has never been run through rustfmt, which would rewrite most of
      # it. Formatting is a decision for the whole tree at once, not a gate.

      # --all-targets so the tests are linted too: without it the gate covered
      # the library and the binaries only, and a lint error sitting in a test
      # stayed invisible until someone ran clippy differently. What fails is
      # set in Cargo.toml ([lints.clippy]: the correctness and suspicious
      # lints); the style lints the Perl-shaped code raises are warnings.
      - name: Clippy (CLI)
        run: cargo clippy --release --all-targets

      - name: Clippy (GUI, parity auditor)
        run: cargo clippy --release --features gui,parity --all-targets

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.label }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable
          # Without this line, `--target` would fail on the macOS x86_64
          # cross-build (the macos-latest runner is arm64).
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install GUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libglib2.0-dev

      - name: Build CLI (with icon on Windows)
        run: cargo build --release --target ${{ matrix.target }} --bin exiftool-rs ${{ runner.os == 'Windows' && '--features win-icon' || '' }}

      - name: Build GUI (with icon on Windows)
        run: cargo build --release --target ${{ matrix.target }} --bin exiftool-rs-gui --features gui${{ runner.os == 'Windows' && ',win-icon' || '' }}

      # The source tree of the ExifTool release the port follows, for the
      # tests that run ExifTool's own scripts, parse its sources or read a
      # written file back with it (tests/common/mod.rs: skipped without it).
      # Unpacked under target/ by a relative path (GNU tar on Windows takes
      # "D:" for a host name), named for Rust by `pwd -W` there.
      - name: Fetch Perl ExifTool ${{ env.EXIFTOOL_VERSION }}
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          mkdir -p target/exiftool
          curl -fsSL "https://github.com/exiftool/exiftool/archive/refs/tags/$EXIFTOOL_VERSION.tar.gz" | tar xz -C target/exiftool
          test -f "target/exiftool/exiftool-$EXIFTOOL_VERSION/lib/Image/ExifTool.pm"
          echo "EXIFTOOL_DIR=$(pwd -W 2>/dev/null || pwd)/target/exiftool/exiftool-$EXIFTOOL_VERSION" >> "$GITHUB_ENV"

      # Release matches how the binaries are built and run (debug panics on
      # arithmetic overflow where Perl's numbers do not). LTO is off and the
      # codegen units are back to 16 for this step only: under LTO every
      # test executable repeats the library's whole optimisation at its own
      # link, so the step would cost several times a release build. Nothing it builds is shipped: it writes to
      # target/release, the packages come from target/<triple>/release.
      # The integration tests run on Linux; on macOS and Windows, the unit
      # tests and the binaries' (the integration tests, which call perl and
      # use Unix paths in places, have not been run there yet), with the
      # smoke tests below.
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --features gui

      - name: Run unit tests (macOS, Windows)
        if: runner.os != 'Linux' && matrix.target != 'x86_64-apple-darwin'
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo test --release --features gui --lib --bins

      - name: Read the test images
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin=target/${{ matrix.target }}/release/exiftool-rs
          "$bin" -ver
          "$bin" -a -u -G1 tests/images > target/read.txt
          echo "$(grep -c '^========' target/read.txt) files, $(wc -l < target/read.txt) lines"
          "$bin" -lang fr -s tests/images | head -20

      # The Win32 modules (src/modules/win32.rs): Unicode file names through
      # Win32API::File (Open, Exists, Rename), Win32::FindFile (wildcards,
      # directories) and Win32::API (WindowsLongPath, FileCreateDate, -P)
      - name: Windows file names, times and attributes
        if: runner.os == 'Windows'
        run: |
          set -ex
          bin=$PWD/target/${{ matrix.target }}/release/exiftool-rs
          mkdir -p target/win32 && cd target/win32
          "$bin" -ver -v | tee ver.txt
          grep -q '^  Win32::API ' ver.txt
          grep -q '^  Win32::FindFile ' ver.txt
          grep -q '^  Win32API::File ' ver.txt
          mkdir -p 'wïn/sübdir'
          cp ../../tests/images/Canon.jpg 'wïn/Ünïcödé 日本.jpg'
          cp ../../tests/images/Canon.jpg 'wïn/sübdir/plain.jpg'
          # a wildcard (quoted: the port's FindFile expands it, not bash)
          "$bin" -charset filename=utf8 -s -FileName -Model 'wïn/*.jpg' | tee out.txt
          grep -q 'FileName *: Ünïcödé 日本.jpg' out.txt
          # a directory, recursively
          # (the "========" file headers and the counts are not names)
          "$bin" -charset filename=utf8 -r -s3 -FileName wïn | grep -v -e '^========' -e '^ ' | LC_ALL=C sort | tee out.txt
          test "$(cat out.txt)" = "$(printf 'plain.jpg\nÜnïcödé 日本.jpg')"
          # writing keeps the file times with -P (SetFileTime)
          f='wïn/Ünïcödé 日本.jpg'
          before=$("$bin" -charset filename=utf8 -s3 -FileModifyDate "$f")
          "$bin" -charset filename=utf8 -P -overwrite_original -Artist=Win32 "$f"
          test "$("$bin" -charset filename=utf8 -s3 -FileModifyDate "$f")" = "$before"
          test "$("$bin" -charset filename=utf8 -s3 -Artist "$f")" = Win32
          # FileCreateDate, written and read back (SetFileTime, GetFileTime)
          "$bin" -charset filename=utf8 '-FileCreateDate=2020:01:02 03:04:05' "$f"
          "$bin" -charset filename=utf8 -s3 -FileCreateDate "$f" | grep -q '^2020:01:02 03:04:05'
          # a write that keeps a backup (Rename), then deleted (Unlink)
          "$bin" -charset filename=utf8 -Comment=Win32 "$f"
          test -f "${f}_original"
          "$bin" -charset filename=utf8 -delete_original! wïn
          test ! -f "${f}_original"
          # the Windows file attributes (GetFileAttributesW)
          attrib +r "$(cygpath -w "$f")"
          "$bin" -charset filename=utf8 -s3 -FileAttributes "$f" | tee out.txt
          grep -q 'Read Only' out.txt
          # a directory with a Unicode name made for a new file (CreateDirectoryW)
          "$bin" -charset filename=utf8 -o 'wïn/nëw/' "$f"
          test -f 'wïn/nëw/Ünïcödé 日本.jpg'

      # What crates.io will get: the packaged sources build on their own
      # (`cargo package` builds them), and the .crate stays under the 10 MB
      # crates.io accepts.
      - name: Package the crate
        if: matrix.label == 'linux-x86_64'
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          cargo package --locked
          size=$(stat -c %s target/package/exiftool-rs-*.crate)
          echo "exiftool-rs.crate: $size bytes"
          test "$size" -lt 10000000 || { echo "::error::the .crate is $size bytes, over crates.io's 10 MB"; exit 1; }

      # --- Packaging (unsigned binaries; Apple signing happens further down,
      # in a job of its own behind the `signing` environment). ---

      # --- Package CLI ---
      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        run: tar czf exiftool-rs-cli-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release exiftool-rs

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/exiftool-rs.exe -DestinationPath exiftool-rs-cli-${{ matrix.label }}.zip

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-${{ matrix.label }}
          path: exiftool-rs-cli-${{ matrix.label }}.*

      # --- Package GUI ---
      - name: Package GUI (Unix)
        if: runner.os != 'Windows'
        run: tar czf exiftool-rs-gui-${{ matrix.label }}.tar.gz -C target/${{ matrix.target }}/release exiftool-rs-gui

      - name: Package GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/exiftool-rs-gui.exe -DestinationPath exiftool-rs-gui-${{ matrix.label }}.zip

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-${{ matrix.label }}
          path: exiftool-rs-gui-${{ matrix.label }}.*

  # The judges, ahead of any signing: the port against the pinned Perl
  # ExifTool (EXIFTOOL_VERSION, NOT the latest — an upstream tag running
  # ahead would otherwise block the release), downloaded with its test
  # suite and images. A failing judge fails the job, so nothing gets signed
  # or published (docs/port/CLI.md):
  # - run_suite.sh: ExifTool's own t/*.t, unchanged, through the port;
  # - compare_images.sh: everything extracted from each t/images file;
  # - compare_cli.py: each command line of the case files, run by Perl's
  #   exiftool and by exiftool-rs, output, exit status and written files.
  # The host's Perl is Ubuntu 24.04's with the modules the judges were
  # written against (scripts/full_modules/Dockerfile says which); the
  # full-modules set runs Perl in that image, with the modules it lacks.
  parity:
    needs: lint
    # (also run by hand, to try the judges before a tag)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2

      - name: Install the host's Perl modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends perl libarchive-zip-perl \
            libio-compress-brotli-perl libterm-readkey-perl util-linux rsync

      - name: Fetch Perl ExifTool ${{ env.EXIFTOOL_VERSION }}
        run: |
          mkdir -p target/exiftool
          curl -fsSL "https://github.com/exiftool/exiftool/archive/refs/tags/$EXIFTOOL_VERSION.tar.gz" | tar xz -C target/exiftool
          test "$(perl "target/exiftool/exiftool-$EXIFTOOL_VERSION/exiftool" -ver)" = "$EXIFTOOL_VERSION"
          echo "EXIFTOOL_DIR=$PWD/target/exiftool/exiftool-$EXIFTOOL_VERSION" >> "$GITHUB_ENV"

      - name: Build the judges' binaries
        run: cargo build --release --example run_t --bin exiftool-rs

      - name: ExifTool's test suite
        run: |
          bash scripts/run_suite.sh "$EXIFTOOL_DIR" | tee target/suite.txt
          # "N scripts, N pass, T/T tests ok", and no failing script
          awk 'NR == 1 { split($5, t, "/"); ok = ($1 == $3 && t[1] == t[2] && $1 > 0) } END { exit !ok }' target/suite.txt
          ! grep -q '^failing:' target/suite.txt

      - name: Every test image
        run: |
          bash scripts/compare_images.sh "$EXIFTOOL_DIR" | tee target/images.txt
          grep -q ' identical, 0 different$' target/images.txt

      - name: Build the full-modules Perl image
        run: docker build -t exiftool-rs-fullperl:local scripts/full_modules

      # Each case file; the known differences are the `-k` and `-pause`
      # prompts (Term::ReadKey reading a terminal there is none of), which
      # docs/port/UPGRADING.md lists. Any other difference fails the job.
      - name: The CLI against Perl's exiftool
        env:
          PORT_BIN: ${{ github.workspace }}/target/release/exiftool-rs
        run: |
          fail=0
          for f in scripts/cli_cases.txt scripts/cli_cases_*.txt; do
            [ "$f" = scripts/cli_cases_full_modules.txt ] && continue
            echo "::group::$f"
            CLI_CASES=$f python3 -I scripts/compare_cli.py "$EXIFTOOL_DIR" | tee target/cli.txt
            echo "::endgroup::"
            if grep '^different ' target/cli.txt | grep -v -E ' -(k|pause)( |$)'; then
              echo "::error::$f: differences with Perl"
              fail=1
            fi
          done
          exit $fail

      - name: The CLI against Perl with the full modules
        env:
          PORT_BIN: ${{ github.workspace }}/target/release/exiftool-rs
          PERL_CMD: scripts/full_modules/perl.sh
          CLI_CASES: scripts/cli_cases_full_modules.txt
        run: |
          python3 -I scripts/compare_cli.py "$EXIFTOOL_DIR" | tee target/cli.txt
          if grep '^different ' target/cli.txt | grep -v -E ' -(k|pause)( |$)'; then
            echo "::error::full modules: differences with Perl"
            exit 1
          fi

  # Apple signing + notarization of the CLI and the GUI. Behind `signing` for the
  # same reason as Windows: the Apple secrets are environment secrets now (unreadable
  # from the `build` job, which declares no environment), and a Developer ID signature
  # commits the owner's identity — it must never go out without explicit approval.
  sign-apple:
    needs: [build, parity]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    environment: signing
    steps:
      - name: Download the macOS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: exiftool-rs-*-macos-*
          path: dl

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Sign & notarize the macOS binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Submit and poll with timeout + retry (3 attempts, 5/15/45 min backoff)
          notarize_once() {
            local zip="$1" label="$2" timeout="$3"

            local output
            output=$(xcrun notarytool submit "$zip" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --verbose 2>&1)
            echo "$output"
            local sub_id
            sub_id=$(echo "$output" | awk '/id:/{print $2; exit}')
            [ -n "$sub_id" ] || { echo "$label: failed to get submission ID"; return 1; }
            echo "$label: submitted (id: $sub_id)"

            local deadline=$((SECONDS + timeout))
            while [ $SECONDS -lt $deadline ]; do
              sleep 30
              local info
              info=$(xcrun notarytool info "$sub_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" 2>&1) || { echo "$label: network error, retrying poll..."; continue; }

              local status
              status=$(echo "$info" | awk '/status:/{print $2; exit}')
              echo "$label: $status"

              case "$status" in
                Accepted) return 0 ;;
                Invalid|Rejected)
                  xcrun notarytool log "$sub_id" \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_ID_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" 2>&1 || true
                  return 1 ;;
              esac
            done
            echo "$label: timed out after $((timeout / 60)) minutes"
            return 2  # timeout, retryable
          }

          notarize() {
            local zip="$1" label="$2"
            local backoffs=(300 900 2700)  # 5 / 15 / 45 minutes
            for i in 0 1 2; do
              echo "$label: attempt $((i + 1))/3"
              notarize_once "$zip" "$label" "${backoffs[$i]}" && return 0
              local rc=$?
              [ $rc -eq 2 ] || return $rc  # only retry on timeout (rc=2)
              [ $i -lt 2 ] && echo "$label: retrying after timeout..."
            done
            return 1
          }

          SIGN_ID="Developer ID Application: Sylvain Gargasson ($APPLE_TEAM_ID)"

          # The four macOS artifacts: CLI + GUI, for each architecture. The
          # binary's name inside the archive depends on the variant, not the label.
          artifacts=(
            "exiftool-rs-cli-macos-arm64:exiftool-rs"
            "exiftool-rs-gui-macos-arm64:exiftool-rs-gui"
            "exiftool-rs-cli-macos-x86_64:exiftool-rs"
            "exiftool-rs-gui-macos-x86_64:exiftool-rs-gui"
          )

          # 1) Sign and verify, then zip for notarization.
          for entry in "${artifacts[@]}"; do
            art="${entry%%:*}"
            bin="${entry##*:}"
            echo "::group::sign $art"
            work="$RUNNER_TEMP/$art"
            mkdir -p "$work"
            tar xzf "dl/$art/$art.tar.gz" -C "$work"

            codesign --force --options runtime \
              --sign "$SIGN_ID" \
              --timestamp "$work/$bin"
            codesign --verify --strict --verbose=2 "$work/$bin"

            ditto -c -k --keepParent "$work/$bin" "$RUNNER_TEMP/$art.zip"
            echo "::endgroup::"
          done

          # 2) Notarize in parallel (each submission spends minutes waiting on
          # Apple), then collect the exit codes one by one.
          pids=()
          for entry in "${artifacts[@]}"; do
            art="${entry%%:*}"
            notarize "$RUNNER_TEMP/$art.zip" "$art" &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}" || { echo "::error::${artifacts[$i]%%:*}: notarization failed"; failed=1; }
          done
          [ $failed -eq 0 ] || exit 1

          # 3) Repackage the signed binaries under their original names.
          for entry in "${artifacts[@]}"; do
            art="${entry%%:*}"
            bin="${entry##*:}"
            tar czf "$art.tar.gz" -C "$RUNNER_TEMP/$art" "$bin"
          done

      - name: Re-upload the signed CLI arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-macos-arm64
          path: exiftool-rs-cli-macos-arm64.tar.gz
          overwrite: true

      - name: Re-upload the signed GUI arm64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-macos-arm64
          path: exiftool-rs-gui-macos-arm64.tar.gz
          overwrite: true

      - name: Re-upload the signed CLI x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-macos-x86_64
          path: exiftool-rs-cli-macos-x86_64.tar.gz
          overwrite: true

      - name: Re-upload the signed GUI x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-macos-x86_64
          path: exiftool-rs-gui-macos-x86_64.tar.gz
          overwrite: true

  # Authenticode-sign the Windows CLI + GUI with ssign — the Linux runner signs
  # them via Certum (no Windows, no vendor stack). Gated by the `signing`
  # environment (owner approval); the release below needs it.
  sign-windows:
    needs: [build, parity]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: signing
    steps:
      - name: Install ssign (prebuilt binary from the latest release)
        run: |
          curl -fsSL https://github.com/Le-Syl21/ssign/releases/latest/download/ssign-linux-x86_64.tar.gz | tar xz
          sudo install -m755 ssign /usr/local/bin/ssign

      - name: Download CLI artifact
        uses: actions/download-artifact@v8
        with:
          name: exiftool-rs-cli-windows-x86_64
          path: dl

      - name: Download GUI artifact
        uses: actions/download-artifact@v8
        with:
          name: exiftool-rs-gui-windows-x86_64
          path: dl

      - name: Sign CLI + GUI with ssign (via Certum)
        env:
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
        run: |
          cd dl
          unzip -o exiftool-rs-cli-windows-x86_64.zip
          unzip -o exiftool-rs-gui-windows-x86_64.zip
          ssign --verbose \
            -n "exiftool-rs" -u "https://github.com/${{ github.repository }}" \
            exiftool-rs.exe exiftool-rs-gui.exe
          sudo apt-get update -qq && sudo apt-get install -y osslsigncode
          # Check the facts, not the presence of a sentence. "Calculated message
          # digest" appears just as much when the digest does NOT match, and says
          # nothing about timestamping: this check therefore used to let through a
          # signature Windows would have rejected, and untimestamped binaries —
          # invalid the moment the certificate expires.
          verify_signature() {
            local out
            out=$(osslsigncode verify "$1" 2>&1) || true
            echo "$out"
            if echo "$out" | grep -q "MISMATCH"; then
              echo "::error::$1: invalid Authenticode digest (Windows would see it as tampered with)"
              return 1
            fi
            if echo "$out" | grep -q "Timestamp is not available"; then
              echo "::error::$1: signature is not timestamped (invalid as soon as the certificate expires)"
              return 1
            fi
            if ! echo "$out" | grep -q "Signature verification: ok"; then
              echo "::error::$1: signature verification failed"
              return 1
            fi
          }
          for f in exiftool-rs.exe exiftool-rs-gui.exe; do
            verify_signature "$f"
          done
          rm -f exiftool-rs-cli-windows-x86_64.zip exiftool-rs-gui-windows-x86_64.zip
          zip -j exiftool-rs-cli-windows-x86_64.zip exiftool-rs.exe
          zip -j exiftool-rs-gui-windows-x86_64.zip exiftool-rs-gui.exe

      - name: Re-upload signed CLI
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-cli-windows-x86_64
          path: dl/exiftool-rs-cli-windows-x86_64.zip
          overwrite: true

      - name: Re-upload signed GUI
        uses: actions/upload-artifact@v7
        with:
          name: exiftool-rs-gui-windows-x86_64
          path: dl/exiftool-rs-gui-windows-x86_64.zip
          overwrite: true

  release:
    # `parity` is named here as well as in the signing jobs: it is the gate
    # that must stop a release, and inheriting it through them would let a
    # change to the signing chain drop it without anyone noticing.
    needs: [build, parity, sign-windows, sign-apple]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Download outside the repo working tree so `cargo publish` (after the
      # checkout below) sees a clean tree.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifacts

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          # Pre-release tags (v*-rc/-beta) are marked "pre-release" in the GitHub UI.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ runner.temp }}/artifacts/**/*

  # crates.io publish — the one irreversible step in the pipeline ("yank" deletes
  # nothing): it therefore runs AFTER the GitHub release, which can be revoked, and
  # only on final tags. Trusted Publishing: no long-lived secret, GitHub attests the
  # workflow's identity (repo + file + environment) and crates.io issues an ephemeral
  # token, revoked when the job ends.
  publish-crates:
    needs: [build, release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write        # needed to request the OIDC token from GitHub

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - name: Get a temporary crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if cargo publish 2>&1 | tee /tmp/publish.log; then
            echo "published"
          elif grep -q "already exists" /tmp/publish.log; then
            echo "this version is already on crates.io — nothing to do"
          else
            exit 1
          fi
