name: pages

# Publish the live parity report to GitHub Pages on every push to main (and on
# demand). Independent of the release pipeline (ci.yml) — a Pages hiccup can
# never block a crate publish. Regenerates the report from the shipped corpus:
# diffs exiftool-rs against the pinned Perl ExifTool tag-by-tag, then renders it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - name: Install ExifTool's optional Perl modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --install-recommends --install-suggests \
            libimage-exiftool-perl

      - name: Generate the parity report
        run: |
          mkdir -p _site
          cargo run --release --features parity --bin parity -- --dump \
            | python3 scripts/parity_report.py > _site/index.html
          test -s _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
